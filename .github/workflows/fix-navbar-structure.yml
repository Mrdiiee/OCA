name: Fix navbar structure at source

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize primary navbar
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.jsx')
          text = page.read_text()
          old = '''          <nav className="nav-links">
            <a className="nav-link" href="/produk">PRODUK</a>
            <a className="nav-link" href="/private-trip">PRIVATE TRIP</a>
            <a className="nav-link" href="/tentang">TENTANG</a>
            <a className="nav-link" href="/kontak">KONTAK</a>
          </nav>'''
          new = '''          <nav className="nav-links" aria-label="Navigasi utama">
            <a className="nav-link" href="/produk">PRODUK</a>
            <a className="nav-link" href="/event">EVENT</a>
            <a className="nav-link" href="/tentang">TENTANG</a>
          </nav>'''
          if old not in text:
              raise SystemExit('Expected navbar markup was not found in app/page.jsx')
          page.write_text(text.replace(old, new, 1))

          event = Path('app/event-menu.jsx')
          text = event.read_text()
          text = text.replace('''    const privateTrip = Array.from(nav.querySelectorAll("a")).find((link) => link.getAttribute("href") === "/private-trip");
    if (!privateTrip) return;
''', '''    const eventLink = Array.from(nav.querySelectorAll("a")).find((link) => link.getAttribute("href") === "/event");
    if (!eventLink) return;
''')
          text = text.replace('privateTrip.replaceWith(wrap);', 'eventLink.replaceWith(wrap);')
          text = text.replace('''      if (contact && !nav.contains(contact)) nav.append(contact);
''', '''      if (contact && !nav.contains(contact)) nav.append(contact);
''')
          event.write_text(text)

          member = Path('app/member-menu.jsx')
          text = member.read_text()
          marker = '''          @media(min-width:981px){
            .shell .nav-main{position:relative!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:0!important}
            .shell .nav-links{position:absolute!important;left:50%!important;top:0!important;transform:translateX(-50%)!important;width:max-content!important;max-width:none!important;min-width:max-content!important;flex:0 0 auto!important;flex-wrap:nowrap!important;justify-content:center!important;white-space:nowrap!important}
            .shell .nav-actions{margin-left:auto!important;flex:0 0 auto!important}
          }
'''
          if marker in text:
              replacement = '''          @media(min-width:981px){
            .shell .nav-main{position:relative!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:0!important}
            .shell .nav .brand{position:absolute!important;left:0!important;top:50%!important;transform:translateY(-50%)!important}
            .shell .nav-links{position:static!important;display:flex!important;align-items:center!important;justify-content:center!important;width:auto!important;min-width:0!important;max-width:none!important;flex:0 0 auto!important;flex-wrap:nowrap!important;white-space:nowrap!important;gap:30px!important}
            .shell .nav-actions{position:absolute!important;right:0!important;top:50%!important;transform:translateY(-50%)!important;margin:0!important;display:flex!important;align-items:center!important;flex:0 0 auto!important}
            .shell .nav-link,.shell .event-nav-trigger{flex:0 0 auto!important}
          }
'''
              text = text.replace(marker, replacement, 1)
          else:
              raise SystemExit('Expected desktop navbar CSS block was not found in app/member-menu.jsx')
          member.write_text(text)
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.jsx app/event-menu.jsx app/member-menu.jsx .github/workflows/fix-navbar-structure.yml
          git rm .github/workflows/fix-navbar-structure.yml
          if git diff --cached --quiet; then
            echo "No navbar changes needed."
            exit 0
          fi
          git commit -m "Fix primary navbar structure and centering"
          git push
