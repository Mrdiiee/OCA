name: Wire homepage Private Trip events
on:
  push:
    branches: [main]
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.jsx')
          s=p.read_text()
          old='import { useMemo, useState } from "react";'
          new='import { useMemo, useState } from "react";\nimport { createServerSupabaseClient } from "../lib/supabase-server";'
          if 'createServerSupabaseClient' not in s:
              s=s.replace(old,new,1)
          old='export default function HomePage() {'
          new='export default async function HomePage() {\n  const supabase = await createServerSupabaseClient();\n  const { data: privateTripEvents = [] } = await supabase.from("events").select("*").eq("published", true).ilike("type", "private trip").order("sort_order", { ascending: true }).order("event_date", { ascending: true }).order("created_at", { ascending: true });'
          if old not in s: raise SystemExit('homepage signature not found')
          s=s.replace(old,new,1)
          marker='<section className="feature feature-trip"'
          start=s.find(marker)
          if start<0: raise SystemExit('trip section not found')
          depth=0; i=start
          while i<len(s):
              if s.startswith('<section',i): depth+=1
              elif s.startswith('</section>',i):
                  depth-=1
                  if depth==0:
                      end=i+len('</section>'); break
              i+=1
          else: raise SystemExit('trip section end not found')
          replacement='''<section className="feature feature-trip">\n      <div className="feature-inner">\n        <div className="feature-copy">\n          <div className="section-kicker">EVENT / PRIVATE TRIP</div>\n          <h2>PRIVATE TRIP.</h2>\n          <p>Perjalanan yang lebih personal, fleksibel, dan disusun sesuai kebutuhan perjalananmu.</p>\n          {privateTripEvents.length > 0 ? (\n            <div className="private-trip-list">\n              {privateTripEvents.map((event) => (\n                <article className="private-trip-item" key={event.id}>\n                  {event.cover_image_url ? <img src={event.cover_image_url} alt="" /> : null}\n                  <div>\n                    <div className="section-kicker">{event.title}</div>\n                    <p>{event.subtitle || event.description || ''}</p>\n                    {event.event_date ? <small>{new Date(event.event_date).toLocaleDateString('id-ID')}</small> : null}\n                    <div className="hero-actions">\n                      <a className="btn" href={`/event/${event.slug}`}>LIHAT EVENT <Icon name="arrow" size={16} /></a>\n                    </div>\n                  </div>\n                </article>\n              ))}\n            </div>\n          ) : (\n            <p className="private-trip-empty">Belum ada Private Trip yang sedang dibuka.</p>\n          )}\n        </div>\n      </div>\n    </section>'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.jsx
          git commit -m 'Connect homepage Private Trip to active events' || true
          git rm .github/workflows/wire-homepage-events.yml
          git commit -m 'Remove temporary homepage event wiring workflow'
          git push
