name: Check Homepage Media Build
on:
  push:
    paths:
      - '.github/workflows/check-homepage-media-build.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit homepage image binding fix
        run: |
          python -c "from pathlib import Path; p=Path('app/page.jsx'); s=p.read_text(); p.write_text(s.replace('<img {homepageMedia.', '<img src={homepageMedia.'))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.jsx
          git commit -m 'Fix homepage media image bindings'
          git rm .github/workflows/check-homepage-media-build.yml
          git commit -m 'Remove temporary homepage media build check'
          git push
