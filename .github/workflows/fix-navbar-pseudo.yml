name: Fix navbar pseudo content

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy navbar pseudo dropdown CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/layout.jsx')
          s = p.read_text()
          pattern = r'@media \(hover:hover\) and \(min-width:981px\)\{.*?\}\n@media\(max-width:980px\)'
          s2, n = re.subn(pattern, '.shell .nav-link::after{content:none!important;display:none!important}\n@media(max-width:980px)', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Expected one legacy navbar CSS block, found {n}')
          p.write_text(s2)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/layout.jsx
          git commit -m 'Fix duplicate navbar labels on initial render'
          git rm .github/workflows/fix-navbar-pseudo.yml
          git commit -m 'Remove one-time navbar fix workflow'
          git push
