name: Stop temp changes
on:
  push:
    branches: [main]
jobs:
  stop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f status-check.txt .github/workflows/stop-temp.yml
          git add -A
          git commit -m 'Remove temporary status files' || true
          git push || true
