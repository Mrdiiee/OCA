name: Fix duplicate payment state

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair landing page syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/page.jsx")
          text = path.read_text()
          if not text.rstrip().endswith("}"):
              path.write_text(text.rstrip() + "\n}\n")
              print("Appended missing component closing brace.")
          else:
              print("Landing page already has a closing brace.")
          PY

      - name: Fix Informasi Akun hover and active states
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/member-menu.jsx")
          text = path.read_text()
          account = re.compile(r'\.shell \.more-menu \.mobile-account-link\{.*?\}', re.S)
          match = account.search(text)
          if not match:
              raise SystemExit("Informasi Akun CSS rule not found; refusing unsafe edit.")
          desired = '.shell .more-menu .mobile-account-link{order:-1!important;display:block!important;width:100%!important;min-height:50px!important;margin:0 0 8px!important;padding:15px 14px!important;border-radius:12px!important;background:#111!important;color:#fff!important;font-size:12px!important;font-weight:800!important;line-height:1.2!important;letter-spacing:.08em!important;text-align:left!important;box-sizing:border-box!important}'
          text = text[:match.start()] + desired + text[match.end():]
          hover = '.shell .more-menu .mobile-account-link:hover,.shell .more-menu .mobile-account-link:focus,.shell .more-menu .mobile-account-link:active{background:#fff!important;color:#111!important;-webkit-text-fill-color:#111!important;visibility:visible!important;opacity:1!important}'
          text = text.replace(hover, '')
          desktop_marker = '@media(min-width:981px){'
          pos = text.find(desktop_marker)
          if pos < 0:
              raise SystemExit("Desktop menu media block not found; refusing unsafe edit.")
          generic_hover = '.shell .more-menu .more-item:hover{background:#f6f6f4!important;color:#e1261c!important}'
          insert_at = text.find(generic_hover, pos)
          if insert_at < 0:
              raise SystemExit("Desktop generic hover rule not found; refusing unsafe edit.")
          insert_at += len(generic_hover)
          text = text[:insert_at] + '\n' + hover + text[insert_at:]
          path.write_text(text)
          print("Informasi Akun hover state normalized.")
          PY

      - name: Update homepage hero copy and Oxygen Index CTA
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/page.jsx")
          text = path.read_text()
          replacements = {
              "Perlengkapan teknis dan pengalaman outdoor untuk mereka yang pergi lebih jauh. Field-tested equipment, private trip, dan dukungan perjalanan dalam satu tempat.": "Perlengkapan teknis dan pengalaman outdoor untuk mereka yang memilih melangkah lebih jauh. Gear teruji di medan, perjalanan yang dirancang dengan baik, dan dukungan petualangan dalam satu tempat.",
              "Perlengkapan teknis dan pengalaman outdoor untuk mereka yang pergi lebih jauh.\nField-tested equipment, private trip, dan dukungan perjalanan dalam satu tempat.": "Perlengkapan teknis dan pengalaman outdoor untuk mereka yang memilih melangkah lebih jauh.\nGear teruji di medan, perjalanan yang dirancang dengan baik, dan dukungan petualangan dalam satu tempat."
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          pattern = re.compile(r'(<(?:a|button)\b[^>]*?)(?:href="[^"]*"\s*)?([^>]*>)(\s*)(BOOK PRIVATE TRIP|Book Private Trip)(\s*)(</(?:a|button)>)', re.I)
          match = pattern.search(text)
          if not match:
              raise SystemExit("Book Private Trip CTA not found; refusing unsafe edit.")
          opening = match.group(1)
          attrs = match.group(2)
          if '<a' in opening.lower():
              opening = re.sub(r'\s*href="[^"]*"', '', opening)
              replacement = opening + ' href="/oxygen-index"' + attrs + 'OXYGEN INDEX' + match.group(6)
          else:
              replacement = opening + attrs + 'OXYGEN INDEX' + match.group(6)
          text = text[:match.start()] + replacement + text[match.end():]
          path.write_text(text)
          print("Homepage CTA changed to Oxygen Index.")
          PY

      - name: Add Oxygen Index to member menu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/member-menu.jsx")
          text = path.read_text()
          if 'oxygen-index-menu-item' not in text:
              marker = 'function polishMobileMenu'
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("polishMobileMenu function not found; refusing unsafe edit.")
              fn = '''function addMobileOxygenIndexLink(menu){\n  if(menu.querySelector('.oxygen-index-menu-item'))return;\n  const item=document.createElement('a');\n  item.className='more-item oxygen-index-menu-item';\n  item.href='/oxygen-index';\n  item.textContent='OXYGEN INDEX';\n  const account=menu.querySelector('.mobile-account-link');\n  if(account)account.insertAdjacentElement('afterend',item);\n  else menu.prepend(item);\n}\n\n'''
              text = text[:pos] + fn + text[pos:]
          if 'addMobileOxygenIndexLink(menu);' not in text:
              marker = 'addMobileAccountLink(menu);'
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("addMobileAccountLink call not found; refusing unsafe edit.")
              pos += len(marker)
              text = text[:pos] + '\n  addMobileOxygenIndexLink(menu);' + text[pos:]
          path.write_text(text)
          print("OXYGEN INDEX added to menu.")
          PY

      - name: Add Oxygen Index to account page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/informasi-user/page.jsx")
          text = path.read_text()
          if 'oxygen-index-card' not in text:
              marker = "  const postalCode = profile?.postal_code || '-';"
              if marker not in text:
                  raise SystemExit("Account page score insertion marker not found; refusing unsafe edit.")
              score_code = """\n  const oxygenScoreRaw = Number(user?.user_metadata?.oxygen_index ?? 0);\n  const oxygenScore = Number.isFinite(oxygenScoreRaw) ? Math.max(0, Math.min(100, Math.round(oxygenScoreRaw))) : 0;\n  const oxygenLevel = oxygenScore >= 90 ? 'OXYGEN CORE' : oxygenScore >= 75 ? 'ADVANCED' : oxygenScore >= 50 ? 'FIELD READY' : oxygenScore >= 25 ? 'TRAIL READY' : 'FOUNDATION';"""
              text = text.replace(marker, marker + score_code)
              action_marker = '            <div className="actions"><a className="btn link" href="/pesanan-saya">PESANAN SAYA</a>'
              if action_marker not in text:
                  raise SystemExit("Account actions marker not found; refusing unsafe edit.")
              card = """            <section className=\"card oxygen-index-card\"><div className=\"label\">OXYGEN INDEX</div><div className=\"index-row\"><strong>{oxygenScore}<span>/100</span></strong><div><b>{oxygenLevel}</b><p>Skor kualifikasi yang ditetapkan tim Oxygen berdasarkan kesiapan, pengalaman, disiplin, dan kontribusi.</p></div></div><a className=\"index-link\" href=\"/oxygen-index\">LIHAT DETAIL OXYGEN INDEX</a></section>\n"""
              text = text.replace(action_marker, card + action_marker)
              css_marker = '.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}'
              css = '.oxygen-index-card{margin-top:18px}.index-row{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center}.index-row>strong{font-size:56px;letter-spacing:-.06em;line-height:1}.index-row>strong span{font-size:14px;color:#77736c;letter-spacing:0;margin-left:5px}.index-row b{font-size:15px}.index-row p{color:#8b887f;font-size:12px;line-height:1.55;margin:7px 0 0}.index-link{display:inline-block;margin-top:18px;color:#f7f6f3;font-size:11px;font-weight:800;text-decoration:none}.index-link:hover{color:#e1261c}@media(max-width:700px){.index-row{grid-template-columns:1fr;gap:12px}}'
              if css_marker not in text:
                  raise SystemExit("Account page CSS marker not found; refusing unsafe edit.")
              text = text.replace(css_marker, css + css_marker)
              path.write_text(text)
              print("Oxygen Index display added to Informasi Akun.")
          else:
              print("Oxygen Index already present on account page.")
          PY

      - name: Commit and push fix
        shell: bash
        run: |
          if git diff --quiet -- app/page.jsx app/member-menu.jsx app/informasi-user/page.jsx; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.jsx app/member-menu.jsx app/informasi-user/page.jsx
          git commit -m "feat: add Oxygen Index experience"
          git push
