name: Repair landing page

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair landing page checkout and images
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/page.jsx")
          text = path.read_text()
          original = text

          old_checkout = '''  async function checkout(items = cart) {
    if (!items.length) { setCheckoutError("Keranjang masih kosong."); return; }
    setCheckoutError("");
    try {
      const response = await fetch("/api/checkout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ items }) });
      const data = await response.json();
      if (!response.ok) { setCheckoutError(data.error || "Checkout gagal."); return; }
      if (window.snap && data.token) { window.snap.pay(data.token); } else setCheckoutError("Pembayaran belum siap. Silakan coba lagi.");
    } catch { setCheckoutError("Tidak dapat terhubung ke server checkout."); }
  }
  function buyNow(item) { const one = { ...item, qty: 1 }; setCart([one]); setCartOpen(true); checkout([one]); }
'''
          new_checkout = '''  function persistCart(items) {
    try { localStorage.setItem("oxygen_cart", JSON.stringify(items)); } catch {}
  }
  function checkout(items = cart) {
    if (!items.length) { setCheckoutError("Keranjang masih kosong."); return; }
    setCheckoutError("");
    persistCart(items);
    window.location.href = "/produk";
  }
  function buyNow(item) {
    const one = { ...item, qty: 1 };
    persistCart([one]);
    window.location.href = "/produk";
  }
'''
          if old_checkout in text:
              text = text.replace(old_checkout, new_checkout, 1)
          elif 'function persistCart(items)' not in text:
              raise SystemExit("Expected landing page checkout block was not found")

          old_img = '<img src={item.image} alt={item.name}/>'
          new_img = '<img src={item.image} alt={item.name} onError={(event)=>{event.currentTarget.onerror=null;event.currentTarget.src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=1200&q=85";}}/>'
          if old_img in text:
              text = text.replace(old_img, new_img, 1)

          if text != original:
              path.write_text(text)
              print("Landing page repaired.")
          else:
              print("Landing page already repaired.")
          PY

      - name: Commit and push repair
        shell: bash
        run: |
          if git diff --quiet -- app/page.jsx; then
            echo "No landing page changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.jsx
          git commit -m "Fix landing page checkout handoff"
          git push
