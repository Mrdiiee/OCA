name: Fix duplicate payment state

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair landing page syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/page.jsx")
          text = path.read_text()
          if not text.rstrip().endswith("}"):
              path.write_text(text.rstrip() + "\n}\n")
              print("Appended missing component closing brace.")
          else:
              print("Landing page already has a closing brace.")
          PY

      - name: Fix desktop account menu states
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/member-menu.jsx")
          text = path.read_text()
          desktop = re.search(r'@media\\(min-width:981px\\)\\{.*?(?=@media\\(max-width:|$)', text, re.S)
          if not desktop:
              raise SystemExit("Desktop media block not found; refusing unsafe edit.")
          block = desktop.group(0)
          account = re.search(r'\\.shell \\.more-menu \\.mobile-account-link\\{.*?\\}', block, re.S)
          if not account:
              raise SystemExit("Desktop account rule not found; refusing unsafe edit.")
          clean_account = '.shell .more-menu .mobile-account-link{order:-1!important;display:block!important;width:100%!important;min-height:50px!important;margin:0 0 8px!important;padding:15px 14px!important;border-radius:12px!important;background:#111!important;color:#fff!important;-webkit-text-fill-color:#fff!important;font-size:12px!important;font-weight:800!important;line-height:1.2!important;letter-spacing:.08em!important;text-align:left!important;box-sizing:border-box!important;visibility:visible!important;opacity:1!important;text-shadow:none!important}'
          block = block[:account.start()] + clean_account + block[account.end():]
          block = re.sub(r'\\.shell \\.more-menu \\.mobile-account-link:(?:hover|active|focus|focus-visible)\\{.*?\\}', '', block, flags=re.S)
          marker = '.shell .more-menu .more-item:hover{background:#f6f6f4!important;color:#e1261c!important}'
          states = marker + '.shell .more-menu .mobile-account-link:hover{background:#111!important;color:#fff!important;-webkit-text-fill-color:#fff!important;visibility:visible!important;opacity:1!important}.shell .more-menu .mobile-account-link:focus,.shell .more-menu .mobile-account-link:focus-visible{background:#fff!important;color:#111!important;-webkit-text-fill-color:#111!important;visibility:visible!important;opacity:1!important;outline:2px solid #111!important;outline-offset:-2px!important}.shell .more-menu .mobile-account-link:active{background:#fff!important;color:#111!important;-webkit-text-fill-color:#111!important;visibility:visible!important;opacity:1!important}'
          if marker in block:
              block = block.replace(marker, states, 1)
          else:
              raise SystemExit("Desktop generic hover rule not found; refusing unsafe edit.")
          text = text[:desktop.start()] + block + text[desktop.end():]
          path.write_text(text)
          print("Desktop Informasi Akun: black/white normally, stays black on hover, becomes white/black on focus and click.")
          PY

      - name: Commit and push fix
        shell: bash
        run: |
          if git diff --quiet -- app/page.jsx app/member-menu.jsx; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.jsx app/member-menu.jsx
          git commit -m "fix: set account menu click state"
          git push
