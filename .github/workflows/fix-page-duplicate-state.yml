name: Fix duplicate payment state

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair landing page syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/page.jsx")
          text = path.read_text()
          if not text.rstrip().endswith("}"):
              path.write_text(text.rstrip() + "\n}\n")
              print("Appended missing component closing brace.")
          else:
              print("Landing page already has a closing brace.")
          PY

      - name: Fix desktop account label visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/member-menu.jsx")
          text = path.read_text()
          pattern = r'(@media\(min-width:981px\)\{\s*.*?\.shell \.more-menu \.mobile-account-link\{)(.*?)(\}\s*\.shell \.more-menu \.mobile-primary-nav)'
          m = re.search(pattern, text, re.S)
          if not m:
              raise SystemExit("Desktop account rule not found; refusing unsafe edit.")
          body = m.group(2)
          for prop in ['color:#fff!important','-webkit-text-fill-color:#fff!important','text-shadow:none!important','visibility:visible!important','opacity:1!important']:
              if prop not in body:
                  body += prop
          replacement = m.group(1) + body + m.group(3)
          text = text[:m.start()] + replacement + text[m.end():]
          path.write_text(text)
          print("Desktop Informasi Akun forced visible and white.")
          PY

      - name: Commit and push fix
        shell: bash
        run: |
          if git diff --quiet -- app/page.jsx app/member-menu.jsx; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.jsx app/member-menu.jsx
          git commit -m "fix: force account menu label visibility"
          git push
