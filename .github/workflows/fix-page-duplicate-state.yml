name: Fix duplicate payment state

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair landing page syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/page.jsx")
          text = path.read_text()
          if not text.rstrip().endswith("}"):
              path.write_text(text.rstrip() + "\n}\n")
              print("Appended missing component closing brace.")
          else:
              print("Landing page already has a closing brace.")
          PY

      - name: Commit and push fix
        shell: bash
        run: |
          if git diff --quiet -- app/page.jsx; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.jsx
          git commit -m "fix: close landing page syntax"
          git push
