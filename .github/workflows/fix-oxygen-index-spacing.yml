name: Fix Oxygen Index spacing
on:
  push:
    paths:
      - '.github/workflows/fix-oxygen-index-spacing.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust logo spacing and INDEX visibility
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/page.jsx')
          s=p.read_text()
          start=s.index('.oxygen-index-logo{')
          end=s.index('.ticker{',start)
          css='''.oxygen-index-logo{--logo-w:clamp(340px,32vw,700px);--logo-h:clamp(58px,5.5vw,118px);--oxy-size:clamp(45px,4.35vw,96px);--idx-size:clamp(40px,3.9vw,86px);--idx-w:clamp(165px,14vw,305px);--idx-h:clamp(48px,4.45vw,98px);position:relative;width:var(--logo-w);height:var(--logo-h);display:block;overflow:visible;background:transparent;color:#050505;border:0;padding:0;text-decoration:none;line-height:1;white-space:nowrap;isolation:isolate;transition:transform .2s,opacity .2s}.oxygen-word{position:absolute;left:0;top:50%;z-index:1;display:block;margin:0;color:#050505;font-family:Arial Black,Arial,Helvetica,sans-serif;font-size:var(--oxy-size);font-weight:900;letter-spacing:-.10em;line-height:.82;transform:translateY(-50%) scaleX(.91);transform-origin:left center}.index-word{position:absolute;z-index:2;right:0;top:50%;width:var(--idx-w);height:var(--idx-h);display:flex;align-items:center;justify-content:center;margin:0;padding:0 3% 1px 8%;background:#ed1c24;color:#fff;font-family:Arial Black,Arial,Helvetica,sans-serif;font-size:var(--idx-size);font-weight:900;letter-spacing:-.065em;line-height:.82;transform:translateY(-50%) skewX(-13deg);clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);transform-origin:center}.index-word span{display:block;transform:skewX(13deg);white-space:nowrap}.oxygen-index-logo:hover{transform:translateY(-1px);opacity:.96}.oxygen-index-logo:active{transform:none}.oxygen-index-logo:focus-visible{outline:2px solid #111;outline-offset:4px}'''
          s=s[:start]+css+s[end:]
          p.write_text(s)
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.jsx
          git commit -m 'Adjust Oxygen Index logo spacing and visibility' || true
          git push
          rm -f .github/workflows/fix-oxygen-index-spacing.yml
          git add .github/workflows/fix-oxygen-index-spacing.yml
          git commit -m 'Clean up temporary logo spacing workflow' || true
          git push
