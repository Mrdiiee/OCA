name: Fix homepage media src

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix JSX image bindings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.jsx')
          s = p.read_text()
          old = s
          s = s.replace('<img {homepageMedia.', '<img src={homepageMedia.')
          if s == old:
              print('No malformed homepage image bindings found.')
          else:
              p.write_text(s)
              print('Fixed malformed homepage image bindings.')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.jsx
          git diff --cached --quiet || git commit -m 'fix: restore homepage image src bindings'
          git rm .github/workflows/fix-homepage-media-src.yml
          git commit -m 'chore: remove temporary homepage fix workflow'
          git push