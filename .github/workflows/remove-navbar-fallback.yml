name: Remove navbar fallback layer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-fallback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove SSR navbar fallback only
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/member-menu.jsx')
          s = p.read_text()

          css_start = s.index('        /* SSR NAV FALLBACK:')
          css_end = s.index('      `,\n      }} />', css_start)
          s = s[:css_start] + s[css_end:]

          nav_start = s.index('      <nav className="og-ssr-nav-fallback"')
          nav_end = s.index('      </nav>', nav_start) + len('      </nav>')
          s = s[:nav_start] + s[nav_end:]

          if 'og-ssr-nav-fallback' in s:
              raise SystemExit('SSR fallback selector/markup still exists after cleanup')

          p.write_text(s)
          print('Removed only the SSR fallback CSS and fallback nav markup.')
          PY

      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/member-menu.jsx
          git diff --cached --check
          git commit -m 'Remove duplicate SSR navbar fallback'
          git rm .github/workflows/remove-navbar-fallback.yml
          git commit -m 'Remove one-time navbar cleanup workflow'
          git push