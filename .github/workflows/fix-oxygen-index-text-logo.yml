name: Fix Oxygen Index Text Logo
on:
  push:
    paths:
      - .github/workflows/fix-oxygen-index-text-logo-trigger.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace homepage Oxygen Index image with text logo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.jsx')
          s=p.read_text()
          import re
          pattern=r'<a className="oxygen-index-image" href="/oxygen-index" aria-label="Oxygen Index"><img[^>]+></a>'
          replacement='<a className="oxygen-index-logo" href="/oxygen-index" aria-label="Oxygen Index"><span className="oxygen-word">OXYGEN</span><span className="index-word">INDEX</span></a>'
          s,n=re.subn(pattern,replacement,s,count=1)
          if n != 1:
              raise SystemExit('Oxygen Index image target not found')
          old_css='.oxygen-index-image{width:180px;height:46px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;padding:0;overflow:hidden;transition:transform .2s,opacity .2s;-webkit-user-drag:none;user-select:none}.oxygen-index-image img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none;pointer-events:none}.oxygen-index-image:hover{transform:translateY(-1px);opacity:.9}.oxygen-index-image:active{transform:none}'
          new_css='.oxygen-index-logo{width:180px;height:46px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:0;padding:0 5px;overflow:hidden;position:relative;line-height:1;white-space:nowrap;transition:transform .2s,opacity .2s}.oxygen-word{position:relative;z-index:1;color:#050505;font-size:25px;font-weight:950;letter-spacing:-.095em;line-height:1;transform:scaleX(.92);transform-origin:right center}.index-word{position:relative;z-index:2;display:inline-flex;align-items:center;justify-content:center;height:34px;margin-left:2px;padding:0 12px 0 14px;background:#e1261c;color:#fff;font-size:24px;font-weight:950;letter-spacing:-.055em;line-height:1;transform:skew(-10deg);clip-path:polygon(10% 0,100% 0,90% 100%,0 100%)}.index-word::first-letter{transform:skew(10deg)}.oxygen-index-logo:hover{transform:translateY(-1px);opacity:.94}.oxygen-index-logo:active{transform:none}.oxygen-index-logo:focus-visible{outline:2px solid #fff;outline-offset:3px}'
          if old_css in s:
              s=s.replace(old_css,new_css,1)
          else:
              raise SystemExit('Oxygen Index CSS target not found')
          mobile_old='@media(max-width:650px){.oxygen-index-image{width:170px;height:42px}'
          mobile_new='@media(max-width:650px){.oxygen-index-logo{width:170px;height:42px}.oxygen-word{font-size:23px}.index-word{height:31px;font-size:22px;padding-left:13px;padding-right:11px}'
          if mobile_old in s:
              s=s.replace(mobile_old,mobile_new,1)
          elif '@media(max-width:650px){' in s and '.oxygen-index-logo{' not in s:
              s=s.replace('@media(max-width:650px){','@media(max-width:650px){.oxygen-index-logo{width:170px;height:42px}.oxygen-word{font-size:23px}.index-word{height:31px;font-size:22px;padding-left:13px;padding-right:11px}',1)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-oxygen-index-text-logo-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.jsx .github/workflows/fix-oxygen-index-text-logo-trigger.txt
          git commit -m 'Replace Oxygen Index image with precise text logo' || exit 0
          git push
