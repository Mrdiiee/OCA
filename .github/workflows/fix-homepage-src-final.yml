name: Final homepage JSX repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed image src bindings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.jsx')
          s = p.read_text()
          replacements = {
            '<img {homepageMedia.hero?.url ||': '<img src={homepageMedia.hero?.url ||',
            '<img {homepageMedia.homepage_01?.url ||': '<img src={homepageMedia.homepage_01?.url ||',
            '<img {homepageMedia.homepage_02?.url ||': '<img src={homepageMedia.homepage_02?.url ||',
            '<img {homepageMedia.homepage_03?.url ||': '<img src={homepageMedia.homepage_03?.url ||',
            '<img {homepageMedia.homepage_04?.url ||': '<img src={homepageMedia.homepage_04?.url ||',
          }
          old = s
          for a,b in replacements.items():
              s = s.replace(a,b)
          if s == old:
              print('No malformed bindings found')
          else:
              p.write_text(s)
              print('Repaired homepage image bindings')
          PY
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.jsx
          if ! git diff --cached --quiet; then git commit -m 'fix: correct homepage image src JSX bindings'; fi
          git rm .github/workflows/fix-homepage-src-final.yml
          git commit -m 'chore: remove temporary homepage repair workflow'
          git push
