name: Cleanup all temporary workflows
on:
  push:
    branches: [main]
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tmp-check.txt status-check.txt
          rm -f .github/workflows/wire-homepage-events.yml .github/workflows/check-homepage-event-wire.yml .github/workflows/run-wire-now.yml .github/workflows/trigger-homepage-event-wire.yml .github/workflows/verify-page-wire.yml .github/workflows/cleanup-temp-workflows.yml .github/workflows/final-cleanup.yml .github/workflows/sanity-cleanup.yml .github/workflows/stop-temp.yml .github/workflows/check-final.yml .github/workflows/cleanup-all.yml
          git add -A
          git commit -m 'Clean temporary workflow files' || true
          git push || true
