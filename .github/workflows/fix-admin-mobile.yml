name: Fix Admin Mobile Layout
on:
  push:
    paths:
      - .github/workflows/fix-admin-mobile.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix admin dashboard mobile overflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/admin/page.jsx')
          s=p.read_text()
          old=".quickGrid{grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}"
          new=".quickGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:18px;min-width:0}"
          if old in s: s=s.replace(old,new,1)
          old="shell:{maxWidth:1180,margin:'0 auto'}"
          new="shell:{width:'100%',maxWidth:1180,margin:'0 auto',boxSizing:'border-box'}"
          if old in s: s=s.replace(old,new,1)
          old="@media(max-width:800px){.quickGrid{grid-template-columns:1fr 1fr!important}"
          new="@media(max-width:980px){.quickGrid{grid-template-columns:1fr 1fr!important}"
          if old in s: s=s.replace(old,new,1)
          old="@media(max-width:520px){.quickGrid{grid-template-columns:1fr!important}"
          new="@media(max-width:640px){.quickGrid{grid-template-columns:1fr!important}"
          if old in s: s=s.replace(old,new,1)
          marker="</main>;"
          guard="<style jsx global>{`html,body{max-width:100%;overflow-x:hidden!important} @media(max-width:640px){.page{width:100%!important;max-width:100%!important;overflow-x:hidden!important}.shell{width:100%!important;max-width:100%!important}.header{align-items:flex-start!important;flex-direction:column!important}.quick{padding:18px!important}.oxygenControl{width:100%!important;box-sizing:border-box!important}.oxygenText{max-width:100%!important}.oxygenMeta{gap:10px!important}.orderRow,.userRow{min-width:0!important}.meta,.email,strong,small{overflow-wrap:anywhere}}</style>"
          s=s.replace(marker,guard+marker,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/admin/page.jsx .github/workflows/fix-admin-mobile.yml
          git commit -m 'fix: make admin dashboard responsive on mobile' || exit 0
          git push
