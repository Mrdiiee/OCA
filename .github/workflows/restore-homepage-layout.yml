name: Restore Homepage Layout
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect previous homepage brand markup
        shell: python
        run: |
          import re, subprocess
          old = subprocess.check_output(['git','show','95ed21d037f4c6d5de0101f9baaaa684c4027439:app/page.jsx'], text=True)
          for needle in ['className="brand"', "className='brand'", 'className={`brand`}', 'brand-mark', 'OXYGEN']:
              print('NEEDLE', needle, 'COUNT', old.count(needle))
          for m in re.finditer(r'.{0,250}brand.{0,500}', old, re.I|re.S):
              print('---MATCH---')
              print(m.group(0)[:1000].replace('\n',' '))
              break
          raise SystemExit(1)
