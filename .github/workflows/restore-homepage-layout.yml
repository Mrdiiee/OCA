name: Restore Homepage Layout
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect previous homepage brand element
        shell: python
        run: |
          import subprocess
          old = subprocess.check_output(['git','show','95ed21d037f4c6d5de0101f9baaaa684c4027439:app/page.jsx'], text=True)
          needle='className="brand"'
          start=0
          for i in range(2):
              p=old.find(needle,start)
              print('OCCURRENCE',i,'POS',p)
              if p < 0: break
              print(old[max(0,p-300):p+900].replace('\n',' '))
              start=p+1
          raise SystemExit(1)
