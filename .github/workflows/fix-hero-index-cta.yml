name: Fix Hero Oxygen Index CTA
on:
  push:
    paths:
      - .github/workflows/fix-hero-index-cta.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage navbar and Oxygen Index CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.jsx')
          s=p.read_text()

          old_nav='<nav className="nav-links"><a className="nav-link" href="/produk">PRODUK</a><a className="nav-link" href="/private-trip">PRIVATE TRIP</a><a className="nav-link" href="/tentang">TENTANG</a><a className="nav-link" href="/kontak">KONTAK</a></nav>'
          new_nav='<nav className="nav-links"><a className="nav-link" href="/produk">PRODUK</a><a className="nav-link" href="/event">EVENT</a><a className="nav-link" href="/member">MEMBER</a><a className="nav-link" href="/tentang">TENTANG</a></nav>'
          if old_nav in s:
              s=s.replace(old_nav,new_nav,1)

          old_actions='<div className="nav-actions"><button className="icon-btn" type="button" aria-label="Cari"><Icon name="search" size={20} /></button><a className="icon-btn" href="/informasi-user" aria-label="Akun"><Icon name="user" size={20} /></a><button className="icon-btn" type="button" aria-label="Keranjang" onClick={() => setCartOpen(true)}><Icon name="bag" size={20} /><span className="bag-count">{count}</span></button></div>'
          new_actions='<div className="nav-actions"><button className="icon-btn" type="button" aria-label="Cari"><Icon name="search" size={20} /></button><a className="icon-btn" href="/informasi-user" aria-label="Akun"><Icon name="user" size={20} /></a><button className="icon-btn" type="button" aria-label="Keranjang" onClick={() => setCartOpen(true)}><Icon name="bag" size={20} /><span className="bag-count">{count}</span></button><details className="more-wrap og-static-menu"><summary className="icon-btn og-menu-trigger" aria-label="Buka menu navigasi"><Icon name="menu" size={20} /></summary><div className="more-menu og-static-menu-panel"><nav className="og-hamburger-list" aria-label="Menu utama"><a className="more-item account-entry" href="/informasi-user">Informasi Akun</a><a className="more-item og-index-item" href="/oxygen-index">OXYGEN INDEX</a><div className="og-primary-grid"><a className="more-item" href="/produk">PRODUK</a><a className="more-item" href="/event">EVENT</a><a className="more-item" href="/member">MEMBER</a><a className="more-item" href="/tentang">TENTANG</a></div><a className="more-item og-order-item" href="/pesanan-saya">PESANAN SAYA <span>· STATUS PENGIRIMAN</span></a><a className="more-item" href="/kontak">KONTAK</a></nav></div></details></div>'
          if old_actions in s:
              s=s.replace(old_actions,new_actions,1)

          old='<a className="btn hero-index-btn" href="/oxygen-index" aria-label="Oxygen Index"><img src={homepageMedia.oxygen_index?.url || "/oxygen-index.webp"} alt="Oxygen Index" draggable="false" /></a>'
          new='<a className="btn hero-index-btn" href="/oxygen-index" aria-label="Oxygen Index">OXYGEN INDEX <Icon name="arrow" size={16}/></a>'
          if old not in s:
              raise SystemExit('hero Oxygen Index image CTA target not found')
          s=s.replace(old,new,1)
          old_css='.hero-index-btn{background:#fff;color:#111;border-color:#fff;overflow:hidden;padding:0!important}.hero-index-btn img{display:block!important;position:static!important;inset:auto!important;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;object-fit:cover!important;object-position:center!important;opacity:1!important;filter:none!important;image-rendering:auto!important;pointer-events:none;-webkit-user-drag:none;user-select:none}.hero-index-btn:hover{background:#fff;border-color:#fff;color:#111}.hero-index-btn:hover img{filter:none!important}'
          new_css='.hero-index-btn{background:#fff;color:#111;border-color:#fff;overflow:hidden}.hero-index-btn:hover{background:#fff;border-color:#fff;color:#111}'
          if old_css in s:
              s=s.replace(old_css,new_css,1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.jsx .github/workflows/fix-hero-index-cta.yml
          git commit -m 'fix: render final navbar in initial HTML' || exit 0
          git push
