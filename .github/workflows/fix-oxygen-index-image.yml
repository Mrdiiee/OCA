name: Fix Oxygen Index Image
on:
  push:
    paths:
      - .github/workflows/fix-oxygen-index-image-trigger.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage CTA layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.jsx')
          s=p.read_text()
          old='<div className="hero-actions"><a className="btn" href="#koleksi">SHOP THE COLLECTION <Icon name="arrow" size={16}/></a><a className="oxygen-index-media" href="/oxygen-index" aria-label="Oxygen Index"><img src={homepageMedia.oxygen_index?.url || "/oxygen-index.webp"} alt="Oxygen Index" /></a></div>'
          new='<div className="hero-actions"><a className="btn hero-collection-btn" href="#koleksi">SHOP THE COLLECTION <Icon name="arrow" size={16}/></a><a className="btn hero-index-btn" href="/oxygen-index" aria-label="Oxygen Index"><img src={homepageMedia.oxygen_index?.url || "/oxygen-index.webp"} alt="Oxygen Index" draggable="false" /></a></div>'
          if old not in s:
              raise SystemExit('Hero CTA target not found')
          s=s.replace(old,new,1)
          s=s.replace('.hero-actions{display:flex;gap:10px;flex-wrap:wrap}', '.hero-actions{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}.hero-actions .hero-collection-btn,.hero-actions .hero-index-btn{width:220px;height:48px;min-height:48px;padding:13px 18px}.hero-index-btn{background:var(--text);color:var(--bg);border-color:var(--text);overflow:hidden}.hero-index-btn img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;pointer-events:none;-webkit-user-drag:none;user-select:none}.hero-index-btn:hover{background:var(--red);border-color:var(--red);color:#fff}.hero-index-btn:hover img{filter:brightness(0) invert(1)}')
          s=s.replace('.oxygen-index-media{display:inline-flex;align-items:center;max-width:min(100%,780px);text-decoration:none}', '.oxygen-index-media{display:inline-flex;align-items:center;max-width:min(100%,780px);text-decoration:none}')
          s=s.replace('@media(max-width:650px){.oxygen-index-logo{--logo-w:190px;--logo-h:50px;--oxy-size:29px;--idx-size:27px;--idx-w:92px;--idx-h:38px}', '@media(max-width:650px){.hero-actions .hero-collection-btn,.hero-actions .hero-index-btn{width:100%;height:48px;min-height:48px}.oxygen-index-logo{--logo-w:190px;--logo-h:50px;--oxy-size:29px;--idx-size:27px;--idx-w:92px;--idx-h:38px}',1)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-oxygen-index-image-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.jsx .github/workflows/fix-oxygen-index-image-trigger.txt
          git commit -m 'fix: align Oxygen Index with hero CTA' || exit 0
          git push
