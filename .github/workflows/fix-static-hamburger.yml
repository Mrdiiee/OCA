name: Fix static hamburger

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Convert hamburger to static React UI
        shell: python
        run: |
          from pathlib import Path

          page = Path("app/page.jsx")
          s = page.read_text()

          if 'const [menuOpen, setMenuOpen] = useState(false);' not in s:
              s = s.replace(
                  '  const [searchOpen, setSearchOpen] = useState(false);\n',
                  '  const [searchOpen, setSearchOpen] = useState(false);\n  const [menuOpen, setMenuOpen] = useState(false);\n',
                  1,
              )

          marker = '.nav-actions{display:flex;align-items:center;gap:7px}'
          menu_css = '''.nav-actions{display:flex;align-items:center;gap:7px}.more-wrap{position:relative;height:100%;display:flex;align-items:center;flex:0 0 auto}.og-menu-trigger{color:var(--text)!important}.og-menu-trigger svg{display:block;width:20px;height:20px}.more-menu{display:none;position:absolute;right:0;top:50px;width:370px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;background:#fff;border:1px solid #e5e5e5;border-top:3px solid #111;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.14);padding:10px;z-index:400;box-sizing:border-box}.more-menu.is-open{display:block}.og-hamburger-list{display:grid;grid-template-columns:1fr;gap:3px}.og-hamburger-list .more-item{display:flex;align-items:center;min-width:0;min-height:48px;padding:13px 14px;border-radius:11px;box-sizing:border-box;color:#222!important;background:transparent;text-decoration:none;text-align:left;font:800 10px/1.25 Arial,sans-serif;letter-spacing:.09em;overflow-wrap:anywhere}.og-hamburger-list .more-item:hover{background:#f5f5f3!important;color:var(--red)!important}.og-hamburger-list .og-index-item{background:#111!important;color:#fff!important;min-height:52px}.og-hamburger-list .og-index-item:hover{background:var(--red)!important;color:#fff!important}.og-primary-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #ececea;border-radius:12px;background:#fafaf8;overflow:hidden}.og-primary-grid .more-item{border-radius:0!important}.og-primary-grid .more-item:nth-child(odd){border-right:1px solid #ececea}.og-primary-grid .more-item:nth-child(-n+2){border-bottom:1px solid #ececea}.og-order-item{border:1px solid #ececea!important;background:#fafaf8!important}.og-hamburger-list .og-order-item span{font-weight:700;letter-spacing:.05em;margin-left:4px}.og-hamburger-list a::before,.og-hamburger-list a::after,.og-hamburger-list svg,.og-hamburger-list .arrow{content:none!important;display:none!important}'''
          if marker in s:
              s = s.replace(marker, menu_css, 1)

          old = '''          <div className="nav-actions">
            <button className="icon-btn" type="button" onClick={() => setSearchOpen((value) => !value)} aria-label="Cari"><Icon name="search" /></button>
            <a className="icon-btn" href="/informasi-user" aria-label="Akun"><Icon name="user" /></a>
            <button className="icon-btn" type="button" onClick={() => setCartOpen(true)} aria-label="Keranjang"><Icon name="bag" /><span className="bag-count">{count}</span></button>
          </div>'''
          new = '''          <div className="nav-actions">
            <button className="icon-btn" type="button" onClick={() => setSearchOpen((value) => !value)} aria-label="Cari"><Icon name="search" /></button>
            <a className="icon-btn" href="/informasi-user" aria-label="Akun"><Icon name="user" /></a>
            <button className="icon-btn" type="button" onClick={() => setCartOpen(true)} aria-label="Keranjang"><Icon name="bag" /><span className="bag-count">{count}</span></button>
            <div className="more-wrap">
              <button className="icon-btn og-menu-trigger" type="button" onClick={() => setMenuOpen((value) => !value)} aria-expanded={menuOpen} aria-haspopup="menu" aria-label="Buka menu navigasi">
                <Icon name="menu" size={20} />
              </button>
              <div className={`more-menu${menuOpen ? " is-open" : ""}`}>
                <nav className="og-hamburger-list" aria-label="Menu utama">
                  <a className="more-item account-entry" href="/informasi-user" role="menuitem">Informasi Akun</a>
                  <a className="more-item og-index-item" href="/oxygen-index" role="menuitem">OXYGEN INDEX</a>
                  <div className="og-primary-grid">
                    <a className="more-item" href="/produk" role="menuitem">PRODUK</a>
                    <a className="more-item" href="/event" role="menuitem">EVENT</a>
                    <a className="more-item" href="/member" role="menuitem">MEMBER</a>
                    <a className="more-item" href="/tentang" role="menuitem">TENTANG</a>
                  </div>
                  <a className="more-item og-order-item" href="/pesanan-saya" role="menuitem">PESANAN SAYA <span>· STATUS PENGIRIMAN</span></a>
                  <a className="more-item" href="/kontak" role="menuitem">KONTAK</a>
                </nav>
              </div>
            </div>
          </div>'''
          if old not in s:
              raise SystemExit('Static nav-actions block not found')
          s = s.replace(old, new, 1)

          mobile = '''@media(max-width:980px){.nav-links{display:none}.category-grid{grid-template-columns:repeat(2,1fr)}'''
          mobile_extra = '''@media(max-width:980px){.nav-links{display:none}.more-wrap{display:flex!important;flex:0 0 auto!important}.og-menu-trigger{width:34px!important;min-width:34px!important;height:40px!important;padding:0!important}.nav-actions{gap:1px!important;min-width:0!important}.nav-actions>.icon-btn{width:32px!important;min-width:32px!important;flex:0 0 32px!important;padding:0!important}.more-menu{position:fixed!important;top:76px!important;left:8px!important;right:8px!important;width:auto!important;max-width:none!important;max-height:calc(100dvh - 88px)!important;overflow-x:hidden!important;overflow-y:auto!important}.category-grid{grid-template-columns:repeat(2,1fr)}'''
          if mobile in s:
              s = s.replace(mobile, mobile_extra, 1)

          mobile420 = '@media(max-width:650px){'
          extra420 = '@media(max-width:420px){.og-menu-trigger{width:32px!important;min-width:32px!important}.nav-actions>.icon-btn{width:30px!important;min-width:30px!important;flex-basis:30px!important}.og-primary-grid{grid-template-columns:1fr}.og-primary-grid .more-item{border-right:0!important;border-bottom:1px solid #ececea!important}.og-primary-grid .more-item:last-child{border-bottom:0!important}}\n@media(max-width:650px){'
          if mobile420 in s and '@media(max-width:420px)' not in s:
              s = s.replace(mobile420, extra420, 1)

          page.write_text(s)

          em = Path("app/event-menu.jsx")
          e = em.read_text()
          start = e.find('  useEffect(() => {\n    const navActions = document.querySelector(".nav-actions");')
          if start != -1:
              end = e.find('\n  useEffect(() => {\n    if (pathname !== "/produk")', start)
              if end == -1:
                  raise SystemExit('Could not find end of hamburger effect')
              e = e[:start] + e[end+1:]
              em.write_text(e)

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.jsx app/event-menu.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Render hamburger statically without hydration injection"
          git push

      - name: Remove workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix-static-hamburger.yml || true
          git commit -m "Remove one-time hamburger fix workflow" || true
          git push || true
